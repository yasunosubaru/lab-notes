name: field note

# A bot-authored pull request, so that the account is a real co-author rather
# than the pull request author. The commit names yasunosubaru as co-author and
# the pull request is merged by yasunosubaru afterwards.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "notes/.keep"

permissions:
  contents: write
  pull-requests: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit a note and open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTE_BODY: "Co-authored-by: yasunosubaru <1845639127@qq.com>"
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          branch="notes/bot-$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          mkdir -p notes
          echo "# Field note $stamp" > "notes/note-$stamp.md"
          git add -A
          git commit -m "docs: field note $stamp" -m "$NOTE_BODY"
          git push origin "HEAD:$branch"
          gh pr create --title "docs: field note $stamp" --body "$NOTE_BODY" --head "$branch" --base main
